name: home-credit-analytics

services:
  postgres:
    image: postgres:17.11
    container_name: home-credit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homecredit
      POSTGRES_USER: homecredit_app
      POSTGRES_PASSWORD: ${HOME_CREDIT_DB_PASSWORD:?Set HOME_CREDIT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - home_credit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecredit_app -d homecredit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  home_credit_postgres_data:
    name: home-credit-postgres-data
